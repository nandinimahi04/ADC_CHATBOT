<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysFriend — AI Desktop Controller (React)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <!-- React 18 & ReactDOM from CDN (Zero-build execution) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">
        <div class="react-loading-fallback">
            <div class="spinner"></div>
            <p>Initializing SysFriend React UI...</p>
        </div>
    </div>

    <!-- React Hooks -->
    <script type="text/babel" src="./src/hooks/useSpeechRecognition.js"></script>
    <script type="text/babel" src="./src/hooks/useAgentApi.js"></script>

    <!-- React Components -->
    <script type="text/babel" src="./src/components/Sidebar.jsx"></script>
    <script type="text/babel" src="./src/components/Topbar.jsx"></script>
    <script type="text/babel" src="./src/components/ChatFeed.jsx"></script>
    <script type="text/babel" src="./src/components/CommandInput.jsx"></script>
    <script type="text/babel" src="./src/components/VoiceVisualizer.jsx"></script>
    <script type="text/babel" src="./src/components/CommandsDirectory.jsx"></script>
    <script type="text/babel" src="./src/components/SecurityView.jsx"></script>
    <script type="text/babel" src="./src/components/MetricsView.jsx"></script>
    <script type="text/babel" src="./src/components/ConfirmationModal.jsx"></script>
    <script type="text/babel" src="./src/components/ConfigModal.jsx"></script>

    <!-- Root App & Mount -->
    <script type="text/babel" src="./src/App.jsx"></script>
    <script type="text/babel" src="./app.js"></script>
</body>
</html>
