services:
  - type: web
    name: sysfriend-agent
    env: node
    plan: free
    buildCommand: cd desktop-agent && npm install
    startCommand: cd desktop-agent && node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
